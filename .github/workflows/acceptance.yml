name: End-to-end acceptance
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_PASSWORD: qpay_local
      MONGO_PASSWORD: qpay_local
      WEBHOOK_SECRET: local-webhook-secret-change-me
      SERVICE_TOKEN: local-service-token
      BANK_DATA_SECRET: ci-bank-data-encryption-secret
      WEBSOCKET_ALLOWED_ORIGINS: http://localhost:*
      QPAY_HTTP_PORT: 8080
      QPAY_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: docker compose -f deploy/ec2/compose.yml config --quiet
      - name: Build and start QPay
        run: docker compose -f deploy/ec2/compose.yml up -d --build
      - name: Wait for authentication migrations
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $health = Invoke-RestMethod http://localhost:8080/actuator/health -TimeoutSec 3
              if ($health.status -eq 'UP') { exit 0 }
            } catch {}
            Start-Sleep -Seconds 5
          }
          docker compose -f deploy/ec2/compose.yml ps
          docker compose -f deploy/ec2/compose.yml logs --tail 100
          throw 'QPay did not become healthy.'
      - name: Seed disposable acceptance principal
        run: docker exec -i -e MYSQL_PWD="$MYSQL_PASSWORD" qpay-mysql mysql -uqpay < scripts/acceptance/seed-local-principal.sql
      - name: Run end-to-end acceptance flow
        shell: pwsh
        run: ./scripts/acceptance/payment-flow.ps1 -MySqlContainer qpay-mysql -MongoContainer qpay-mongodb
      - name: Capture failure diagnostics
        if: failure()
        run: docker compose -f deploy/ec2/compose.yml logs --tail 200
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/ec2/compose.yml down -v
