name: End-to-end acceptance
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_PASSWORD: qpay_local
      MONGO_PASSWORD: qpay_local
      WEBHOOK_SECRET: local-webhook-secret-change-me
      SERVICE_TOKEN: local-service-token
      BANK_DATA_SECRET: ci-bank-data-encryption-secret
      WEBSOCKET_ALLOWED_ORIGINS: http://localhost:*
      QPAY_HTTP_PORT: 8080
      QPAY_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: docker compose --project-name qpay -f deploy/ec2/compose.yml config --quiet
      - name: Build and start QPay
        run: docker compose --project-name qpay -f deploy/ec2/compose.yml up -d --build
      - name: Wait for every application
        shell: bash
        run: |
          services=(
            authentication-service:8081 user-service:8082 merchant-service:8083
            wallet-service:8084 payment-service:8085 payout-service:8086
            notification-service:8087 reconciliation-service:8088 api-gateway:8080
          )
          for service in "${services[@]}"; do
            ready=false
            for attempt in $(seq 1 60); do
              if docker run --rm --network qpay_qpay curlimages/curl:8.16.0 \
                  --fail --silent "http://${service}/actuator/health" | grep -q '"status":"UP"'; then
                ready=true
                break
              fi
              sleep 5
            done
            if [ "$ready" != true ]; then
              docker compose --project-name qpay -f deploy/ec2/compose.yml ps
              docker compose --project-name qpay -f deploy/ec2/compose.yml logs --tail 100
              echo "${service} did not become healthy" >&2
              exit 1
            fi
          done
      - name: Seed disposable acceptance principal
        run: docker exec -i -e MYSQL_PWD="$MYSQL_PASSWORD" qpay-mysql mysql -uqpay < scripts/acceptance/seed-local-principal.sql
      - name: Run end-to-end acceptance flow
        shell: pwsh
        run: |
          try {
            ./scripts/acceptance/payment-flow.ps1 -MySqlContainer qpay-mysql -MongoContainer qpay-mongodb
          } catch {
            $message = $_.Exception.Message.Replace("`r", " ").Replace("`n", " ")
            Write-Output "::error title=QPay acceptance failure::$message"
            throw
          }
      - name: Capture failure diagnostics
        if: failure()
        run: docker compose --project-name qpay -f deploy/ec2/compose.yml logs --tail 200
      - name: Stop stack
        if: always()
        run: docker compose --project-name qpay -f deploy/ec2/compose.yml down -v
