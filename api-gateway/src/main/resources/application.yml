server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authentication-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates: [Path=/api/v1/auth/**]
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates: [Path=/api/v1/users/**]
            - id: merchant-service
              uri: ${MERCHANT_SERVICE_URL:http://localhost:8083}
              predicates: [Path=/api/v1/merchants/**]
            - id: wallet-service
              uri: ${WALLET_SERVICE_URL:http://localhost:8084}
              predicates: [Path=/api/v1/wallets/**]
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - "Path=/api/v1/payments/**,/api/v1/utility-payments/**,/api/v1/webhooks/providers/payments/**"
            - id: payout-service
              uri: ${PAYOUT_SERVICE_URL:http://localhost:8086}
              predicates:
                - "Path=/api/v1/payouts/**,/api/v1/beneficiaries/**,/api/v1/webhooks/providers/payouts/**"
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
