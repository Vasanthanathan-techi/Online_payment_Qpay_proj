server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: authentication-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/qpay_auth?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:qpay}
    password: ${DB_PASSWORD:qpay_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
qpay.jwt.issuer: ${JWT_ISSUER_URI:http://localhost:8081}
