server.port: ${SERVER_PORT:8088}
spring.application.name: reconciliation-service
spring.datasource.url: ${DB_URL:jdbc:mysql://localhost:13306/qpay_reconciliation?createDatabaseIfNotExist=true}
spring.datasource.username: ${DB_USERNAME:qpay}
spring.datasource.password: ${DB_PASSWORD:qpay_local}
spring.jpa.open-in-view: false
spring.jpa.hibernate.ddl-auto: validate
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
spring.servlet.multipart.max-file-size: 10MB
spring.servlet.multipart.max-request-size: 11MB
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
