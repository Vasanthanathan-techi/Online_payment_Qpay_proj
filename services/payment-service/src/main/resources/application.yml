server.port: ${SERVER_PORT:8085}
spring.application.name: payment-service
spring.datasource.url: ${DB_URL:jdbc:mysql://localhost:13306/qpay_payment?createDatabaseIfNotExist=true}
spring.datasource.username: ${DB_USERNAME:qpay}
spring.datasource.password: ${DB_PASSWORD:qpay_local}
spring.jpa.open-in-view: false
spring.jpa.hibernate.ddl-auto: validate
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
qpay.payment.provider: ${PAYMENT_PROVIDER:stub}
qpay.payment.fee-basis-points: ${PAYMENT_FEE_BPS:200}
qpay.payment.webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-webhook-secret-change-me}
qpay.wallet.url: ${WALLET_SERVICE_URL:http://localhost:8084}
qpay.service-token: ${QPAY_SERVICE_TOKEN:local-service-token}
qpay.utility.fee-basis-points: ${UTILITY_FEE_BPS:50}
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
