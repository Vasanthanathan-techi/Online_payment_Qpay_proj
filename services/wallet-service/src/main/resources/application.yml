server.port: ${SERVER_PORT:8084}
spring.application.name: wallet-service
spring.datasource.url: ${DB_URL:jdbc:mysql://localhost:13306/qpay_wallet?createDatabaseIfNotExist=true}
spring.datasource.username: ${DB_USERNAME:qpay}
spring.datasource.password: ${DB_PASSWORD:qpay_local}
spring.jpa.open-in-view: false
spring.jpa.hibernate.ddl-auto: validate
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit: false
spring.kafka.consumer.auto-offset-reset: earliest
spring.kafka.consumer.properties.isolation.level: read_committed
spring.kafka.listener.ack-mode: record
qpay.kafka.retry.interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
qpay.kafka.retry.max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
qpay.kafka.partitions: ${KAFKA_PARTITIONS:3}
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
qpay.service-token: ${QPAY_SERVICE_TOKEN:local-service-token}
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
