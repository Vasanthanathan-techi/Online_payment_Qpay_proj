server.port: ${SERVER_PORT:8087}
spring.application.name: notification-service
spring.mongodb.uri: ${MONGODB_URI:mongodb://qpay:qpay_local@localhost:27017/qpay_notification?authSource=admin}
spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit: false
spring.kafka.consumer.auto-offset-reset: earliest
spring.kafka.listener.ack-mode: record
spring.mongodb.auto-index-creation: true
qpay.notification.firebase.mode: ${FIREBASE_MODE:logging}
qpay.notification.retry.interval-ms: ${NOTIFICATION_RETRY_INTERVAL_MS:2000}
qpay.notification.retry.max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:5}
qpay.websocket.allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:*}
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
