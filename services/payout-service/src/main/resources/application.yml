server.port: ${SERVER_PORT:8086}
spring.application.name: payout-service
spring.datasource.url: ${DB_URL:jdbc:mysql://localhost:13306/qpay_payout?createDatabaseIfNotExist=true}
spring.datasource.username: ${DB_USERNAME:qpay}
spring.datasource.password: ${DB_PASSWORD:qpay_local}
spring.jpa.open-in-view: false
spring.jpa.hibernate.ddl-auto: validate
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
qpay.wallet.url: ${WALLET_SERVICE_URL:http://localhost:8084}
qpay.service-token: ${QPAY_SERVICE_TOKEN:local-service-token}
qpay.bank-data-secret: ${BANK_DATA_SECRET:local-dev-key-change-before-production}
qpay.payout.fee-basis-points: ${PAYOUT_FEE_BPS:100}
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
