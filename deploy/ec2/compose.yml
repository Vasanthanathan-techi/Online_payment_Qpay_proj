x-app: &app
  restart: unless-stopped
  networks: [qpay]
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }

x-mysql-app: &mysql-app
  DB_USERNAME: qpay
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_ISSUER_URI: http://authentication-service:8081

services:
  mysql:
    image: mysql:8.4
    container_name: qpay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: qpay
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../infra/mysql/init.sql:/docker-entrypoint-initdb.d/01-qpay.sql:ro
    networks: [qpay]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  mongodb:
    image: mongo:8.0
    container_name: qpay-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: qpay
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes: [mongo-data:/data/db]
    networks: [qpay]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u qpay -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    container_name: qpay-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    networks: [qpay]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    container_name: qpay-kafka
    restart: unless-stopped
    networks: [qpay]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  authentication-service:
    <<: *app
    image: qpay/authentication-service:${QPAY_IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: Dockerfile, args: { MODULE: services/authentication-service } }
    environment:
      <<: *mysql-app
      DB_URL: jdbc:mysql://mysql:3306/qpay_auth
      REDIS_HOST: redis

  user-service:
    <<: *app
    image: qpay/user-service:${QPAY_IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: Dockerfile, args: { MODULE: services/user-service } }
    environment:
      <<: *mysql-app
      DB_URL: jdbc:mysql://mysql:3306/qpay_user

  merchant-service:
    <<: *app
    image: qpay/merchant-service:${QPAY_IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: Dockerfile, args: { MODULE: services/merchant-service } }
    environment:
      <<: *mysql-app
      DB_URL: jdbc:mysql://mysql:3306/qpay_merchant

  wallet-service:
    <<: *app
    image: qpay/wallet-service:${QPAY_IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: Dockerfile, args: { MODULE: services/wallet-service } }
    environment:
      <<: *mysql-app
      DB_URL: jdbc:mysql://mysql:3306/qpay_wallet
      QPAY_SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}

  payment-service:
    <<: *app
    image: qpay/payment-service:${QPAY_IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: Dockerfile, args: { MODULE: services/payment-service } }
    environment:
      <<: *mysql-app
      DB_URL: jdbc:mysql://mysql:3306/qpay_payment
      REDIS_HOST: redis
      WALLET_SERVICE_URL: http://wallet-service:8084
      QPAY_SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      PAYMENT_WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}

  payout-service:
    <<: *app
    image: qpay/payout-service:${QPAY_IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: Dockerfile, args: { MODULE: services/payout-service } }
    environment:
      <<: *mysql-app
      DB_URL: jdbc:mysql://mysql:3306/qpay_payout
      WALLET_SERVICE_URL: http://wallet-service:8084
      QPAY_SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      BANK_DATA_SECRET: ${BANK_DATA_SECRET:?BANK_DATA_SECRET is required}

  notification-service:
    <<: *app
    image: qpay/notification-service:${QPAY_IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: Dockerfile, args: { MODULE: services/notification-service } }
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      MONGODB_URI: mongodb://qpay:${MONGO_PASSWORD}@mongodb:27017/qpay_notification?authSource=admin
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:?WEBSOCKET_ALLOWED_ORIGINS is required}

  reconciliation-service:
    <<: *app
    image: qpay/reconciliation-service:${QPAY_IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: Dockerfile, args: { MODULE: services/reconciliation-service } }
    environment:
      <<: *mysql-app
      DB_URL: jdbc:mysql://mysql:3306/qpay_reconciliation

  api-gateway:
    <<: *app
    image: qpay/api-gateway:${QPAY_IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: Dockerfile, args: { MODULE: api-gateway } }
    depends_on:
      authentication-service: { condition: service_started }
      user-service: { condition: service_started }
      merchant-service: { condition: service_started }
      wallet-service: { condition: service_started }
      payment-service: { condition: service_started }
      payout-service: { condition: service_started }
      notification-service: { condition: service_started }
      reconciliation-service: { condition: service_started }
    environment:
      REDIS_HOST: redis
      JWT_ISSUER_URI: http://authentication-service:8081
      AUTH_SERVICE_URL: http://authentication-service:8081
      USER_SERVICE_URL: http://user-service:8082
      MERCHANT_SERVICE_URL: http://merchant-service:8083
      WALLET_SERVICE_URL: http://wallet-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      PAYOUT_SERVICE_URL: http://payout-service:8086
    ports: ["${QPAY_HTTP_PORT:-80}:8080"]

networks:
  qpay:

volumes:
  mysql-data:
  mongo-data:
  redis-data:
